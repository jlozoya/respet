  updateBulletin(id: ID!, input: UpdateBulletinInput!): Bulletin!
  updateComment(id: ID!, input: UpdateCommentInput!): Comment!
  updateDeveloperApp(id: ID!, input: UpdateDeveloperAppInput!): DeveloperApp!

  """Configura el webhook. La primera vez devuelve el secreto de firma."""
  updateDeveloperAppWebhook(id: ID!, input: UpdateWebhookInput!): AppCredentials!
  updateLanguage(input: UpdateLanguageInput!): User!
  updateLocation(input: UpdateLocationInput!): User!

  """Cambia la foto de perfil. Se sube en la propia operación."""
