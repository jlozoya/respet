  updateOrderState(id: ID!, input: UpdateOrderStateInput!): Order!
  updatePermissions(input: UpdatePermissionsInput!): UserPermissions!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  updateProfile(input: UpdateProfileInput!): User!
  updateStoryHighlight(id: ID!, input: StoryHighlightInput!): StoryHighlight!
  updateUserAvatar(file: Upload!, id: ID!): Media!
  updateUserLocation(id: ID!, input: UpdateLocationInput!): User!
  updateUserProfile(id: ID!, input: UpdateProfileInput!): User!
  updateWarehouse(id: ID!, input: UpdateWarehouseInput!): Warehouse!

