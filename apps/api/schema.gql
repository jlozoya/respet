  """Empieza un directo. Devuelve el pase para emitir."""
  startLiveStream(input: StartLiveInput): LiveConnection!
  unblockUser(id: ID!): Boolean!
  unfollowUser(id: ID!): FollowResult!
  unlikeComment(id: ID!): CommentLikeResult!
  unregisterPushDevice(token: String!): Boolean!

  """Deja de guardarla. Devuelve si queda guardada."""
