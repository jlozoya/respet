<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Social Network</title>

  <!--
    La raíz, no una ruta relativa: con `./`, una dirección de dos tramos
    —`/profile/ana`, un enlace compartido— haría que el navegador buscara los
    archivos de la aplicación colgando de ese tramo y la página quedaría en
    blanco al recargar.
  -->
  <base href="/" />

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242526" media="(prefers-color-scheme: dark)">

  <meta name="description" content="Una red social para contar lo que pasa a tu alrededor, seguir a quien te interesa y hablar con quien quieras.">
  <meta name="application-name" content="Social Network">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Social Network">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta property="og:title" content="Social Network">
  <meta property="og:site_name" content="Social Network">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Una red social para contar lo que pasa a tu alrededor, seguir a quien te interesa y hablar con quien quieras.">
  <meta property="og:image" content="assets/imgs/landing.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/icon/favicon.png">

  <!--
    El nombre, la descripción y el icono de aquí son sólo el punto de partida:
    `BrandingService` los reescribe con los de la instalación en cuanto arranca
    la aplicación.
  -->

  <!--
    Direcciones, claves y marca que se deciden al desplegar, no al compilar. La
    imagen de Docker lo reescribe al arrancar; en desarrollo va vacío.
  -->
  <script src="env.js"></script>

  <!--
    El tema, antes de pintar nada.

    `ThemeService` lo aplica cuando arranca Angular, que es tarde: quien usa el
    oscuro vería un instante la aplicación en blanco. Esto lee la misma
    preferencia —la guarda `@capacitor/preferences`, que en la web usa
    `localStorage` con su prefijo— y pone la clase de inmediato.
  -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('CapacitorStorage.app.theme');
        var preference = raw ? JSON.parse(raw) : 'system';
        var dark = preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('ion-palette-dark');
        }
      } catch (error) {
        // Sin almacenamiento se queda el tema claro.
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
