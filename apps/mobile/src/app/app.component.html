<ion-app>
  <!--
    Un solo menú, en dos formas.

    En una pantalla ancha el panel se queda fijo al lado del contenido, como en
    cualquier red social de escritorio; en una estrecha se repliega y vuelve a
    ser el cajón que abre el botón de la cabecera, que Ionic esconde solo
    mientras el panel está a la vista. Antes había dos navegaciones distintas
    —ésta y una columna propia del muro— con las mismas entradas escritas dos
    veces, y en un monitor salían las dos a la vez.
  -->
  <ion-split-pane contentId="main" when="(min-width: 1100px)">
    <!--
      Sin sesión el menú queda desactivado, que en Ionic es tanto como no
      existir: ni se ancla al lado del contenido ni se puede abrir por encima.
      Se deja en su sitio —en vez de no pintarlo— porque `ion-split-pane`
      reparte los papeles de «panel» y «contenido» una sola vez, al nacer: un
      menú que apareciera después se quedaría sin anclar hasta recargar.
    -->
    <ion-menu
      menuId="main-menu"
      contentId="main"
      side="start"
      [disabled]="!isAuthenticated()"
    >
      <ion-header>
        <ion-toolbar color="dark-accent">
          <ion-title color="medium">{{ 'NAV.MENU' | translate }}</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        @if (isAuthenticated()) {
          <!--
            `autoHide` en falso es imprescindible: sin él, `ion-menu-toggle`
            esconde lo que envuelve justo cuando el menú está fijo, que es
            cuando más falta hace. Envolviéndolo, elegir un sitio cierra el
            cajón en el móvil sin que cada entrada tenga que ocuparse de ello.
          -->
          <ion-menu-toggle [autoHide]="false">
            <app-nav-rail />
          </ion-menu-toggle>

          <ion-item>
            <ion-select
              [ngModel]="themePreference()"
              (ngModelChange)="changeTheme($event)"
              name="theme"
              [label]="'THEME.LABEL' | translate"
              [cancelText]="'CANCEL' | translate"
              [okText]="'ACCEPT' | translate"
            >
              @for (option of themeOptions; track option.value) {
                <ion-select-option [value]="option.value">
                  {{ option.label | translate }}
                </ion-select-option>
              }
            </ion-select>
          </ion-item>

          <ion-item lines="none">
            <ion-select
              [ngModel]="currentLanguage()"
              (ngModelChange)="changeLanguage($event)"
              name="lang"
              [label]="'LANG_SELECTOR' | translate"
              [cancelText]="'CANCEL' | translate"
              [okText]="'ACCEPT' | translate"
            >
              @for (option of languages(); track option.code) {
                <ion-select-option [value]="option.code">{{ option.label }}</ion-select-option>
              }
            </ion-select>
          </ion-item>
        }
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main" />
  </ion-split-pane>

  <!--
    El chat, anclado abajo a la derecha por encima de todo. Se monta fuera del
    panel para que siga ahí al cambiar de pantalla: una conversación abierta no
    se cierra porque vayas del muro al carrito.
  -->
  @if (isAuthenticated()) {
    <app-chat-dock />
  }
</ion-app>
