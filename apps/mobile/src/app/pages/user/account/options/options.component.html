<!--
  El final de la pantalla: primero lo inocuo, luego salir, y abajo del todo lo
  que no tiene vuelta. Los vínculos y la contraseña se fueron a `app-access`,
  arriba, junto al correo.
-->
<ion-list lines="full">
  @if (isSelf()) {
    <ion-item button detail="false" (click)="downloadMyInfo()">
      <ion-icon name="download-outline" slot="start" />
      <ion-label>{{ 'DOWNLOAD_MY_INFO' | translate }}</ion-label>
    </ion-item>

    <ion-item button detail="false" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start" />
      <ion-label>{{ 'NAV.LOGOUT' | translate }}</ion-label>
    </ion-item>
  }

  <ion-item button detail="false" (click)="deleteAccount()">
    <ion-icon name="trash" slot="start" color="danger" />
    <ion-label color="danger">
      {{ (isSelf() ? 'DELETE_MY_ACCOUNT' : 'DELETE_ACCOUNT') | translate }}
    </ion-label>
  </ion-item>
</ion-list>
