<!--
  El final de la pantalla: primero lo inocuo y abajo del todo lo que no tiene
  vuelta. Salir vive en el menú lateral, que está a la vista en todas las
  pantallas; repetirlo aquí era una segunda puerta al mismo sitio.
-->
<ion-list lines="full">
  @if (isSelf()) {
    <ion-item button detail="false" (click)="downloadMyInfo()">
      <ion-icon name="download-outline" slot="start" />
      <ion-label>{{ 'DOWNLOAD_MY_INFO' | translate }}</ion-label>
    </ion-item>
  }

  <ion-item button detail="false" (click)="deleteAccount()">
    <ion-icon name="trash" slot="start" color="danger" />
    <ion-label color="danger">
      {{ (isSelf() ? 'DELETE_MY_ACCOUNT' : 'DELETE_ACCOUNT') | translate }}
    </ion-label>
  </ion-item>
</ion-list>
