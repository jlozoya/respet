<app-page-header title="NAV.WAREHOUSES">
  <ion-searchbar
    [debounce]="300"
    [placeholder]="'SEARCH' | translate"
    (ionInput)="onSearch($event.detail.value ?? '')"
  />
</app-page-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  <ion-row>
    @for (warehouse of items(); track warehouse.id) {
      <ion-col size="12" size-md="6" size-lg="4">
        <app-warehouse-card
          [warehouse]="warehouse"
          (updated)="onUpdated($event)"
          (deleted)="onDeleted($event)"
        />
      </ion-col>
    } @empty {
      @if (!loading()) {
        <ion-col size="12">
          <p class="empty">{{ 'WAREHOUSE.EMPTY' | translate }}</p>
        </ion-col>
      }
    }
  </ion-row>

  <ion-infinite-scroll [disabled]="!hasMore()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>

  @if (canCreate()) {
    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button (click)="create()" [attr.aria-label]="'WAREHOUSE.NEW_TITLE' | translate">
        <ion-icon name="add-circle-outline" />
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
