<app-page-header title="RESET_PASSWORD" backTo="/login" />

<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12" size-sm="10" offset-sm="1" size-md="6" offset-md="3">
      @if (hasToken()) {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-list>
            <ion-item>
              <ion-input
                formControlName="password"
                type="password"
                autocomplete="new-password"
                [label]="'PASSWORD' | translate"
                labelPlacement="stacked"
              >
                <ion-input-password-toggle slot="end" />
              </ion-input>
            </ion-item>
            <app-control-messages [control]="form.controls.password" />

            <ion-item>
              <ion-input
                formControlName="passwordConfirmation"
                type="password"
                autocomplete="new-password"
                [label]="'PASSWORD_CONFIRMATION' | translate"
                labelPlacement="stacked"
              >
                <ion-input-password-toggle slot="end" />
              </ion-input>
            </ion-item>
            <app-control-messages [control]="form.controls.passwordConfirmation" />
          </ion-list>

          <ion-button type="submit" expand="block" [disabled]="submitting()">
            {{ 'SAVE' | translate }}
          </ion-button>
        </form>
      } @else {
        <ion-text color="danger">
          <p>{{ 'SERVER.BAD_TOKEN' | translate }}</p>
        </ion-text>
      }
    </ion-col>
  </ion-row>
</ion-content>
