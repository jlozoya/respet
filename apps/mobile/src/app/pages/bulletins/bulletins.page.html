<app-page-header title="NAV.BULLETINS">
  <ion-searchbar
    [debounce]="300"
    [placeholder]="'SEARCH' | translate"
    (ionInput)="onSearch($event.detail.value ?? '')"
  />
</app-page-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  <ion-row>
    @for (bulletin of items(); track bulletin.id) {
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card color="light">
          <img
            [src]="bulletin.media?.url ?? fallbackImage"
            [alt]="bulletin.media?.alt ?? bulletin.title"
            (error)="onImageError($event)"
          />
          <ion-card-content>
            <div class="head">
              <div>
                <p class="date">
                  <small>{{ bulletin.date | date: 'mediumDate' }}</small>
                </p>
                <h2>{{ bulletin.title }}</h2>
              </div>

              @if (isAdmin()) {
                <ion-button
                  fill="clear"
                  color="medium"
                  (click)="openMenu($event, bulletin)"
                  [attr.aria-label]="'OPTIONS' | translate"
                >
                  <ion-icon slot="icon-only" name="menu-outline" />
                </ion-button>
              }
            </div>

            <p>{{ bulletin.description }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    } @empty {
      @if (!loading()) {
        <ion-col size="12">
          <p class="empty">{{ 'BULLETIN.EMPTY' | translate }}</p>
        </ion-col>
      }
    }
  </ion-row>

  <ion-infinite-scroll [disabled]="!hasMore()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>

  @if (isAdmin()) {
    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button (click)="create()" [attr.aria-label]="'BULLETIN.NEW_TITLE' | translate">
        <ion-icon name="add-circle-outline" />
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
