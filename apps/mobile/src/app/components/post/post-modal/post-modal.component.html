@if (images().length === 0) {
  <!-- Sin fotos no hay nada sobre lo que flotar: cabecera normal. -->
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button (click)="dismiss()" [attr.aria-label]="'CLOSE' | translate">
          <ion-icon slot="icon-only" name="arrow-back" />
        </ion-button>
      </ion-buttons>

      <ion-title size="small">{{ 'POST.DETAIL_TITLE' | translate }}</ion-title>
    </ion-toolbar>
  </ion-header>
}

<ion-content [fullscreen]="images().length > 0">
  <div class="reparto" [class.reparto--con-fotos]="images().length > 0">
    @if (images().length > 0) {
      <section class="panel-fotos">
        <app-carousel
          class="carrusel"
          [images]="images()"
          [startIndex]="startIndex()"
          (indexChanged)="currentIndex.set($event)"
        />

        <ion-button
          class="cerrar"
          shape="round"
          [attr.aria-label]="'CLOSE' | translate"
          (click)="dismiss()"
        >
          <ion-icon slot="icon-only" name="close" />
        </ion-button>

        @if (images().length > 1) {
          <span class="contador">{{ currentIndex() + 1 }} / {{ images().length }}</span>
        }
      </section>
    }

    <aside class="panel-hilo">
      <app-post-card
        [post]="current()"
        [detailed]="true"
        [embedded]="true"
        (updated)="onUpdated($event)"
        (deleted)="onDeleted()"
      />

      <h2 class="titulo-hilo">{{ 'COMMENTS.TITLE' | translate }}</h2>

      <app-post-comments [postId]="current().id" (counted)="onCounted($event)" />
    </aside>
  </div>
</ion-content>
