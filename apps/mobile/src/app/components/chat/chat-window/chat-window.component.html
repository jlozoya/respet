<article class="ventana" [class.ventana--plegada]="collapsed()">
  <header class="cabecera">
    <!-- La cabecera entera pliega y despliega, como en Messenger. -->
    <button type="button" class="quien" (click)="toggle()">
      @if (conversation(); as hilo) {
        <img class="avatar" [src]="avatarUrl()" [alt]="hilo.peer.name" (error)="onAvatarError($event)" />

        <span class="texto">
          <span class="nombre">{{ hilo.peer.name }}</span>
          @if (peerOnline()) {
            <small class="estado">{{ 'CHAT.ONLINE' | translate }}</small>
          }
        </span>
      }
    </button>

    <div class="mandos">
      <!--
        A la conversación completa se llega desde las dos: es donde están las
        fotos, el historial hacia atrás y el menú de cada mensaje.
      -->
      <ion-button
        fill="clear"
        size="small"
        color="medium"
        [routerLink]="['/chat', conversationId()]"
        [title]="'CHAT.OPEN_FULL' | translate"
        [attr.aria-label]="'CHAT.OPEN_FULL' | translate"
      >
        <ion-icon slot="icon-only" name="open-outline" />
      </ion-button>

      @if (!embedded()) {

        <ion-button
          fill="clear"
          size="small"
          color="medium"
          (click)="toggle()"
          [attr.aria-label]="'CHAT.COLLAPSE' | translate"
        >
          <ion-icon slot="icon-only" [name]="collapsed() ? 'chevron-up' : 'chevron-down'" />
        </ion-button>

        <ion-button
          fill="clear"
          size="small"
          color="medium"
          (click)="close()"
          [attr.aria-label]="'CLOSE' | translate"
        >
          <ion-icon slot="icon-only" name="close" />
        </ion-button>
      }
    </div>
  </header>

  @if (!collapsed()) {
    <div class="hilo" #hilo>
      <!--
        La pila se empuja hacia abajo con un margen automático en lugar de con
        `justify-content`, que en una caja con desbordamiento deja lo que sale
        por arriba fuera del alcance del ratón.
      -->
      <div class="pila">
        @if (loading()) {
          <div class="esperando"><ion-spinner name="crescent" /></div>
        } @else {
          @for (bubble of bubbles(); track bubble.message.id) {
            <app-message-bubble [bubble]="bubble" />
          } @empty {
            <p class="vacio">{{ 'CHAT.NO_MESSAGES' | translate }}</p>
          }
        }
      </div>
    </div>

    <footer class="redactor">
      <ion-textarea
        [value]="draft()"
        (ionInput)="onDraftChange($event.detail.value ?? '')"
        (keydown)="onKeydown($event)"
        [placeholder]="'CHAT.PLACEHOLDER' | translate"
        [attr.aria-label]="'CHAT.PLACEHOLDER' | translate"
        [autoGrow]="true"
        [rows]="1"
        [maxlength]="4000"
      />

      <ion-button
        fill="clear"
        [disabled]="!canSend()"
        (click)="send()"
        [attr.aria-label]="'SEND' | translate"
      >
        <ion-icon slot="icon-only" name="send" />
      </ion-button>
    </footer>
  }
</article>
