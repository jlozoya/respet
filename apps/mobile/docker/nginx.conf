# La aplicación web: archivos estáticos con vuelta a index.html para las rutas
# de Angular.
#
# Las cabeceras de seguridad van en un fragmento que se incluye en cada
# `location`: nginx descarta las `add_header` del bloque `server` en cuanto una
# `location` declara las suyas.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Lo que lleva huella en el nombre no cambia nunca: caché de un año.
  location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|webp|ico)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/app-headers.conf;
    add_header Cache-Control "public, immutable";
    expires 1y;
  }

  # La entrada y la configuración cambian con cada despliegue: siempre frescas.
  location = /index.html {
    include /etc/nginx/snippets/app-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /env.js {
    include /etc/nginx/snippets/app-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/snippets/app-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
