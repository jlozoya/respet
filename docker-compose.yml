# Base de datos para desarrollo.
#
#   docker compose up -d      levanta Mongo
#   docker compose down       lo para
#   docker compose down -v    lo para y borra los datos
#
# Las credenciales coinciden con las de `apps/api/.env.example`, así que copiar
# ese archivo a `.env` basta para que la API conecte sin tocar nada más.
#
# Ya no hay servicio de MySQL: era la base de la API cuando usaba Prisma. Para
# volcar una base antigua se levanta aparte y se apunta `MYSQL_URL` a ella;
# `npm run migrate:mongo` la lee sin modificarla.

# El nombre del proyecto va fijo: si no, Docker lo saca del nombre de la
# carpeta, y clonar el repositorio con otro nombre —o renombrarla— dejaría los
# datos en unos volúmenes que ya no se usan.
name: social-network

services:
  # Base de datos de la aplicación.
  #
  # Va en «replica set» de un solo nodo porque Mongo sólo ofrece transacciones
  # así, y aquí hacen falta: el inventario y los pedidos no pueden quedarse a
  # medias. El puerto 27019 es para no chocar con otros Mongo de la máquina.
  #
  # El conjunto se inicia solo la primera vez que arranca, desde la
  # comprobación de salud. Su único miembro es `mongo:27017` —de ahí el
  # `hostname` fijo—: con el nombre que Docker da por defecto, que es el id del
  # contenedor, recrearlo dejaría a Mongo sin reconocerse en su propia
  # configuración y sin aceptar escrituras.
  mongo:
    image: mongo:8
    container_name: social-network-mongo
    hostname: mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27019:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Pasa sólo cuando el nodo ya es primario y admite escrituras; si el
      # conjunto aún no existe, lo crea y avisa de que todavía no está listo.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { db.hello().isWritablePrimary || quit(1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); quit(1) }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Reparte los avisos en tiempo real entre varias instancias de la API. En
  # desarrollo es opcional: sin `REDIS_URL` la API los guarda en memoria.
  redis:
    image: redis:8-alpine
    container_name: social-network-redis
    restart: unless-stopped
    ports:
      - '6380:6379'

  # Servidor de vídeo para los directos, en modo desarrollo: clave `devkey`,
  # secreto `secret`, y todo el tráfico WebRTC por un único puerto UDP para no
  # tener que abrir un rango entero en Docker.
  livekit:
    image: livekit/livekit-server:v1.9
    container_name: social-network-livekit
    restart: unless-stopped
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '127.0.0.1']
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

volumes:
  mongo-data:
